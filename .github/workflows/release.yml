name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[build]"
      - name: Build .app bundle
        run: bash scripts/build_macos.sh
      - name: Zip the bundle
        run: |
          cd dist
          ditto -c -k --sequesterRsrc --keepParent PlotaViz.app plotaviz-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: plotaviz-macos
          path: dist/plotaviz-macos.zip

  build-appimage:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Qt runtime deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libfuse2 file
      - run: pip install -e ".[build]"
      - name: Build AppImage
        run: bash scripts/build_appimage.sh
      - uses: actions/upload-artifact@v4
        with:
          name: plotaviz-appimage
          path: dist/PlotaViz-*.AppImage

  publish:
    needs: [build-macos, build-appimage]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/plotaviz-macos/plotaviz-macos.zip
            artifacts/plotaviz-appimage/PlotaViz-*.AppImage
          generate_release_notes: true
          body: |
            PlotaViz release. Qt (PySide6) is LGPLv3 and is dynamically linked in these bundles;
            see THIRD_PARTY_LICENSES for attribution and relinking information.

  publish-pypi:
    needs: [build-macos, build-appimage]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install build
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
