name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      # Qt needs these system libs on the Linux runners.
      - name: Install Linux Qt deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 xvfb

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Type check (core is headless, so this is the strict part)
        run: mypy plotaviz/core

      - name: Test (Linux, virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a pytest -v

      - name: Test (macOS)
        if: runner.os == 'macOS'
        run: pytest -v

  cli-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon-x11-0 libxcb-cursor0 xvfb
      - run: pip install -e ".[dev]"
      - name: Headless CLI export must work without a display
        run: |
          plotaviz --input samples/sales_timeseries.csv --auto --export /tmp/chart.png
          test -s /tmp/chart.png
      - name: Generated code must actually run
        run: |
          plotaviz --input samples/iris_like.csv --auto --export-code /tmp/repro.py
          python /tmp/repro.py --no-show
