name: Bug report
description: Something in PlotaViz is broken or behaves unexpectedly
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please do **not** attach datasets containing sensitive data,
        and never paste an API key — PlotaViz stores keys in the OS keyring precisely so they
        don't end up in text like this.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you expected, and what you got instead.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open sample.csv
        2. Set column "id" to categorical in the type override panel
        3. Click Recommend
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Which part?
      options:
        - Loading a file
        - Preprocessing / cleaning report
        - Type override
        - Filters / query bar
        - Chart selection (wrong chart recommended)
        - Chart rendering (interactive view)
        - Export image
        - Export generated code
        - Natural-language query / LLM
        - Session save / load
        - CLI mode
        - Packaging / install
        - Other
    validations:
      required: true

  - type: textarea
    id: dataset
    attributes:
      label: Dataset shape
      description: >
        Row count, column count, and the column types involved. A minimal CSV that reproduces
        the problem is the single most useful thing you can attach.

  - type: input
    id: version
    attributes:
      label: PlotaViz version
      placeholder: "0.1.0, or the commit SHA"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Linux — Debian/Ubuntu
        - Linux — Arch
        - Linux — Fedora
        - Linux — other
    validations:
      required: true

  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "3.11.9"

  - type: dropdown
    id: install
    attributes:
      label: How did you install it?
      options:
        - pip install -e . from source
        - macOS .app bundle
        - Linux AppImage
        - Distro package (.deb / .rpm / AUR)
        - Other

  - type: textarea
    id: logs
    attributes:
      label: Error output
      description: Any error dialog text or console output. This is rendered as a code block.
      render: text
