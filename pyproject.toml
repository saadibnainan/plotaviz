[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "plotaviz"
version = "0.1.0"
description = "Cross-platform desktop app that auto-selects and renders the right chart for any dataset — rules + scoring engine with optional LLM assist."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "PlotaViz contributors" }]
keywords = [
    "data-visualization",
    "data-analysis",
    "pyside6",
    "qt",
    "pandas",
    "polars",
    "plotly",
    "matplotlib",
    "desktop-app",
    "llm",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Visualization",
]

dependencies = [
    "PySide6>=6.6",
    "pandas>=2.1",
    "numpy>=1.26",
    "polars>=0.20",
    "pyarrow>=14",
    "plotly>=5.18",
    "matplotlib>=3.8",
    "openpyxl>=3.1",
    "keyring>=24",
    "Jinja2>=3.1",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
fast = ["pyqtgraph>=0.13"]
llm = ["anthropic>=0.34", "openai>=1.40", "google-genai>=0.3", "httpx>=0.27"]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pandas-stubs",
    "types-PyYAML",
    "pre-commit>=3.8",
    "httpx>=0.27",
]
build = ["pyinstaller>=6.6"]

[project.scripts]
plotaviz = "plotaviz.main:main"

[project.urls]
Homepage = "https://github.com/saadibnainan/plotaviz"
Issues = "https://github.com/saadibnainan/plotaviz/issues"
Changelog = "https://github.com/saadibnainan/plotaviz/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["plotaviz*"]

[tool.setuptools.package-data]
plotaviz = ["core/*.yaml", "resources/*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = [
    "B008",
    "RUF012",
    # PlotaViz's user-facing strings deliberately use typographic characters — "12 × 4 columns",
    # en dashes in prose. Flagging them as "ambiguous" fights the copy rather than helping it.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
ignore_missing_imports = true
disallow_untyped_defs = false
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
